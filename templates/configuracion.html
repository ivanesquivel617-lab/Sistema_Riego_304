
{% extends "base.html" %}

{% block titulo %}Configuración{% endblock %}

{% block contenido %}

<h2>Configuración del sistema</h2>

<div class="tarjeta">

    <form method="POST">

        <label for="humedad_minima">
            Humedad mínima (0 a 100%):
        </label>

        <input
            type="number"
            id="humedad_minima"
            name="humedad_minima"
            min="0"
            max="100"
            value="{{ sistema['humedad_minima'] }}"
            required
        >

        <label for="duracion">
            Duración del riego (1 a 60 minutos):
        </label>

        <input
            type="number"
            id="duracion"
            name="duracion"
            min="1"
            max="60"
            value="{{ sistema['duracion'] }}"
            required
        >

        <button type="submit">Guardar configuración</button>

    </form>

</div>

{% endblock %}
